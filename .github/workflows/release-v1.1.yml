name: Release v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify manifest version
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const m=require("./manifest.json"); if (m.version !== "1.1.0") { throw new Error(`Expected manifest 1.1.0, got ${m.version}`); }'

      - name: Build Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          release_name="DRAFTED-v1.1.0"
          mkdir -p "dist/${release_name}/lib" "dist/${release_name}/icons"
          cp manifest.json background.js content.js content.css options.html options.js options.css "dist/${release_name}/"
          cp lib/core.js "dist/${release_name}/lib/core.js"
          cp icons/icon16.png icons/icon48.png icons/icon128.png "dist/${release_name}/icons/"
          cd dist
          zip -r "${release_name}.zip" "${release_name}"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          DRAFTED v1.1.0 is the first hands-on usability release after the MVP.

          Highlights:
          - allowed reference URLs for plot notes and research
          - active weekday controls
          - draggable, remembered keystroke HUD
          - quiet `DISCHARGED.` completion
          - emergency exit on the blocked-tab warning only
          - military-inspired UI and extension icons
          - improved settings guidance and documentation
          - HUD dragging fix verified in real Chrome use

          Install: download `DRAFTED-v1.1.0.zip`, extract it, open `chrome://extensions/`, enable Developer mode, choose Load unpacked, and select the extracted `DRAFTED-v1.1.0` folder.

          This release is for direct/local use. DRAFTED is not published to the Chrome Web Store.
          EOF

      - name: Create GitHub Release and upload ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v1.1.0"
          asset="dist/DRAFTED-v1.1.0.zip"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "DRAFTED v1.1.0" \
              --notes-file release-notes.md
          fi

          gh release upload "$tag" "$asset" --clobber
